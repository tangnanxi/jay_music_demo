<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=393, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>青花瓷 · 时空密室</title>
<style>
  /* ===== 青花瓷视觉 token：天青 / 釉青 / 瓷白 / 墨青 / 描金 ===== */
  :root{
    --qing:#6fc3d9;            /* 天青（主强调） */
    --qing-deep:#3e88ae;       /* 釉青（按钮深端） */
    --qing-lite:#9fd9e8;       /* 天青浅 */
    --porcelain:#f2f8fb;       /* 瓷白 */
    --ink:#0c1b26;             /* 墨青底 */
    --gold:#e8c37a;            /* 描金（探索热点专用） */
    --jade:#7fe0b6;            /* 釉里青（成功/正确态） */
    --serif:"Songti SC","STSong","Noto Serif SC","SimSun",serif;
    --r-card:14px;             /* 圆角系统：卡片 14 / 小 chip 10 / 按钮 pill */
    --r-chip:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;user-select:none}
  html,body{height:100%}
  body{background:#0c0804;display:flex;align-items:center;justify-content:center;overflow:hidden}
  #app{width:393px;height:852px;position:relative;overflow:hidden;transform-origin:center;
    background:#12212e;box-shadow:0 0 60px rgba(0,0,0,.85)}
  .screen{position:absolute;inset:0;display:none;flex-direction:column;animation:rise .5s cubic-bezier(.16,1,.3,1)}
  .screen.on{display:flex}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }

  /* 顶部关卡条 */
  .hd{position:absolute;top:0;left:0;right:0;z-index:20;padding:32px 16px 12px;
    background:linear-gradient(180deg,rgba(10,20,30,.72),rgba(10,20,30,0));display:flex;align-items:center;gap:10px}
  .hd .stp{font-size:11px;color:#cfeaf4;background:rgba(111,195,217,.18);border:1px solid rgba(111,195,217,.38);
    border-radius:var(--r-chip);padding:3px 10px;letter-spacing:1px}
  .hd .ttl{font-size:15px;font-weight:700;color:var(--porcelain);letter-spacing:2px;
    font-family:var(--serif);text-shadow:0 1px 3px rgba(0,0,0,.5)}
  .hd .bgm{margin-left:auto;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.35);
    border:1px solid rgba(255,255,255,.35);color:#fff;font-size:14px;cursor:pointer}

  .stage{position:absolute;inset:0}
  .hint{position:absolute;top:64px;left:16px;right:16px;z-index:15;text-align:left;font-size:12.5px;
    color:#eaf4fa;line-height:1.75;background:rgba(9,23,33,.66);border-radius:var(--r-card);padding:10px 14px 10px 16px;
    backdrop-filter:blur(10px) saturate(1.5);-webkit-backdrop-filter:blur(10px) saturate(1.5);
    border:1px solid rgba(111,195,217,.22);box-shadow:inset 2.5px 0 0 var(--qing),0 8px 24px rgba(0,0,0,.35)}
  .hint b{color:var(--jade)}

  /* 通用底部按钮/提示（青釉按钮） */
  .cbtn{background:linear-gradient(180deg,#7cc6db,#3e88ae);color:#fff;border:none;border-radius:999px;
    padding:13px 22px;font-size:15px;font-weight:800;letter-spacing:1px;cursor:pointer;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 20px rgba(62,136,174,.42);
    transition:transform .12s,box-shadow .12s}
  .cbtn:active{transform:scale(.97) translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 3px 8px rgba(62,136,174,.4)}
  .cbtn.ghost{background:rgba(242,248,251,.92);color:#2c6386;box-shadow:0 6px 16px rgba(0,0,0,.25)}
  .toast{position:absolute;left:16px;right:16px;bottom:120px;z-index:50;text-align:center;font-size:12.5px;
    color:#fff;background:rgba(14,32,44,.92);border:1px solid rgba(111,195,217,.25);border-radius:var(--r-card);
    padding:10px 14px;opacity:0;transform:translateY(8px);transition:.28s;pointer-events:none}
  .toast.show{opacity:1;transform:none}

  /* 过场/剧情 */
  #story{background:radial-gradient(120% 70% at 50% 0%,#20415c,#122130 60%,#0a151f);justify-content:center;padding:34px 26px}
  #story .tag{align-self:center;font-size:11px;color:#bfe4f0;border:1px solid rgba(111,195,217,.5);border-radius:999px;padding:3px 14px;margin-bottom:18px;letter-spacing:2px}
  #story h1{font-size:30px;color:var(--porcelain);letter-spacing:4px;margin-bottom:16px;text-align:center;font-family:var(--serif);font-weight:700}
  #story p{font-size:13.5px;color:#a9c6d8;line-height:1.95;margin-bottom:10px;text-indent:2em}
  #story .cbtn{margin-top:24px;align-self:center}

  /* 纯 CSS 青花瓷瓶（剧情/结局共用主视觉） */
  .pvase{position:relative;width:96px;height:168px;margin:2px auto 20px;flex:none;
    filter:drop-shadow(0 12px 30px rgba(111,195,217,.4))}
  .pvase .lip{position:absolute;left:50%;top:0;width:44px;height:9px;transform:translateX(-50%);
    border-radius:4px;background:linear-gradient(90deg,#cfe3ec,#fff 48%,#bcd6e2)}
  .pvase .neck{position:absolute;left:50%;top:8px;width:30px;height:34px;transform:translateX(-50%);
    background:linear-gradient(90deg,#d8e9f0,#fff 46%,#c2dbe6)}
  .pvase .neck::after{content:"";position:absolute;left:3px;right:3px;top:12px;height:3px;border-radius:2px;
    background:repeating-linear-gradient(90deg,#4a86ad 0 4px,transparent 4px 7px)}
  .pvase .body{position:absolute;left:50%;top:38px;width:96px;height:112px;transform:translateX(-50%);
    background:radial-gradient(58% 38% at 34% 26%,rgba(255,255,255,.95),rgba(255,255,255,0) 62%),
      linear-gradient(90deg,#cfe3ec,#ffffff 44%,#b7d3e0);
    border-radius:50% 50% 46% 46%/56% 56% 44% 44%}
  .pvase .band{position:absolute;left:50%;top:82px;width:86px;height:30px;transform:translateX(-50%);
    border-radius:8px;overflow:hidden;opacity:.92;
    background:radial-gradient(circle 7px at 12px 15px,#fff 4px,#3d7fae 5px 7px,transparent 8px),
      radial-gradient(circle 7px at 40px 15px,#fff 4px,#3d7fae 5px 7px,transparent 8px),
      radial-gradient(circle 7px at 68px 15px,#fff 4px,#3d7fae 5px 7px,transparent 8px),
      linear-gradient(180deg,#4a8cb5,#2e6f9e)}
  .pvase .band::before,.pvase .band::after{content:"";position:absolute;left:0;right:0;height:2px;background:rgba(240,249,253,.75)}
  .pvase .band::before{top:2px}
  .pvase .band::after{bottom:2px}
  .pvase .foot{position:absolute;left:50%;bottom:0;width:44px;height:14px;transform:translateX(-50%);
    border-radius:0 0 6px 6px;background:linear-gradient(90deg,#c2d8e2,#f2f8fb 46%,#b0cbd9)}
  .pvase.glowing::before{content:"";position:absolute;left:50%;top:52%;width:210px;height:210px;
    transform:translate(-50%,-50%);border-radius:50%;z-index:-1;
    background:radial-gradient(circle,rgba(111,195,217,.5),rgba(111,195,217,0) 65%)}

  /* 场景内热点：大（进入/操作）与小（线索） */
  .roomtap{position:absolute;transform:translate(-50%,-50%);width:96px;height:96px;border-radius:50%;
    border:2px dashed rgba(240,199,94,.95);background:rgba(120,230,170,.12);cursor:pointer;z-index:16;
    display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;color:#fff;font-size:12px;
    text-shadow:0 1px 3px #000;animation:pulse 1.6s infinite}
  .spot{position:absolute;transform:translate(-50%,-50%);width:62px;height:62px;border-radius:50%;z-index:16;
    border:2px dashed rgba(240,199,94,.85);background:rgba(240,199,94,.08);cursor:pointer;
    display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px;color:#ffe9b0;font-size:11px;
    text-shadow:0 1px 3px #000;animation:pulse 1.8s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(240,199,94,.5)}50%{box-shadow:0 0 0 14px rgba(240,199,94,0)}}

  /* 线索卡（宣纸/画稿/石碑/名录…） */
  .cluewrap{position:absolute;inset:0;z-index:40;background:rgba(5,12,18,.72);display:flex;align-items:center;justify-content:center;animation:fade .25s}
  .cluecard{width:300px;background:linear-gradient(165deg,#f7f1e2,#e8dcc2);border-radius:var(--r-card);border:1px solid #c9b98e;
    padding:20px 18px;color:#4a3a22;box-shadow:0 18px 50px rgba(0,0,0,.6);text-align:center;position:relative}
  .cluecard::before{content:"";position:absolute;inset:5px;border:1px solid rgba(138,106,53,.35);border-radius:10px;pointer-events:none}
  .cluecard h3{font-size:14px;color:#8a6a35;letter-spacing:4px;margin-bottom:10px;font-family:var(--serif);font-weight:700}
  .cluecard .bd{font-size:14.5px;line-height:2.1}
  .cluecard .cls{margin-top:14px;font-size:11px;color:#9b8a63}
  .cluecard.ink{background:linear-gradient(165deg,#101c26,#16283a);border-color:#3f6c8c;color:#cfe6f2}
  .cluecard.ink h3{color:#7fd6e8}
  .cluecard.ink .cls{color:#5a7a8c}
  .cluecard .big{font-size:44px;margin:6px 0}
  .cluecard .cbtn{margin-top:12px;font-size:13px;padding:10px 20px}
  .cluechip{font-size:11px;color:#ffe9b0;background:rgba(120,90,40,.5);border:1px solid rgba(240,199,94,.5);
    border-radius:12px;padding:4px 10px;cursor:pointer;display:inline-block}

  /* BPM 谜题 */
  .gauge{position:absolute;left:24px;right:24px;top:120px;z-index:15}
  .gauge .lab{display:flex;justify-content:space-between;font-size:11px;color:#eaf4fa;margin-bottom:5px}
  .gauge .bar{position:relative;height:14px;border-radius:8px;background:rgba(0,0,0,.4);overflow:hidden;border:1px solid rgba(255,255,255,.5)}
  .gauge .band{position:absolute;top:0;bottom:0;left:44%;width:12%;background:rgba(90,210,150,.65)}
  .gauge .needle{position:absolute;top:-4px;width:4px;height:22px;border-radius:3px;background:#ffd24a;transform:translateX(-50%);transition:left .05s}
  .gauge .bpm{text-align:center;font-size:12px;color:#eaf4fa;margin-top:6px;font-weight:800}
  .gauge .bpm b{color:#7fe0b6}
  .glow{position:absolute;left:47%;top:60%;width:300px;height:300px;transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(circle,rgba(120,230,170,.6),rgba(120,230,170,0) 62%);opacity:0;transition:.25s;z-index:12;pointer-events:none}
  .handle{position:absolute;top:60%;left:66%;transform:translate(-50%,-50%);z-index:16;width:52px;height:26px;border-radius:8px;
    cursor:grab;touch-action:none;background:linear-gradient(180deg,#f0d79a,#c69a4a 60%,#8a6322);
    border:2px solid #d9b45e;box-shadow:0 3px 8px rgba(0,0,0,.5)}
  .sbar{position:absolute;left:24px;right:24px;top:186px;z-index:15;opacity:0;transition:.2s}
  .sbar.show{opacity:1}
  .sbar .t{height:8px;border-radius:6px;background:rgba(0,0,0,.4);overflow:hidden;border:1px solid rgba(255,255,255,.5)}
  .sbar .f{height:100%;width:0;background:linear-gradient(90deg,#7fe0b6,#3aa865);transition:width .1s}
  .sbar .c{text-align:center;font-size:11px;color:#7fe0b6;margin-top:4px;font-weight:800}

  /* 通用居中卡片面板 */
  .panel{position:absolute;left:0;right:0;bottom:0;top:56%;z-index:14;background:linear-gradient(180deg,rgba(18,33,46,0),rgba(12,24,34,.92) 16%);
    padding:26px 18px 22px;display:flex;flex-direction:column;align-items:center;gap:12px;overflow-y:auto}
  .panel.full{top:0;background:linear-gradient(180deg,rgba(18,33,46,.82),rgba(10,21,31,.93));justify-content:flex-start;padding-top:110px}
  .prow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

  /* 瓷胚调色 */
  .vase{width:120px;height:190px;position:relative;margin:0 auto;transition:filter .5s}
  .vase.done{filter:drop-shadow(0 0 18px rgba(120,220,250,.85))}
  .vzone{position:absolute;left:0;right:0;border:2px solid #cfe0ea;background:#f4f8fb;transition:background .4s;cursor:pointer}
  .vzone .zl{position:absolute;right:-6px;top:50%;transform:translate(100%,-50%);font-size:10px;color:#9fc0d4;white-space:nowrap}
  .vz-top{top:0;height:34%;border-radius:44% 44% 0 0/60% 60% 0 0}
  .vz-mid{top:34%;height:34%}
  .vz-bot{top:68%;height:32%;border-radius:0 0 40% 40%/0 0 46% 46%}
  .vfill{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
  .vfill .ink{position:absolute;left:50%;top:55%;width:14px;height:14px;border-radius:50%;filter:blur(4px);
    transform:translate(-50%,-50%) scale(0);transition:transform 1s ease-out,opacity .5s}
  .vzone.on .ink{transform:translate(-50%,-50%) scale(22)}
  .vzone.bad .ink{opacity:0}
  .mixrow{display:flex;align-items:center;gap:8px;width:100%;justify-content:center;padding:0 2px}
  .inkwell{width:44px;height:44px;border-radius:50%;background:#3f83bd;border:5px solid #20282e;flex:none;
    box-shadow:inset 0 3px 8px rgba(0,0,0,.55);transition:background .12s}
  .shname{font-size:11px;color:#eaf4fa;font-weight:800;min-width:64px;text-align:center;white-space:nowrap}

  /* 铜镜聚云 */
  .skyaim{position:absolute;transform:translate(-50%,-50%);width:90px;height:90px;border-radius:50%;z-index:13;pointer-events:none;
    background:radial-gradient(circle,rgba(190,240,255,.4),rgba(190,240,255,0) 65%);animation:pulse 2s infinite;transition:.6s}
  .skyaim.hit{width:170px;height:170px;animation:none;
    background:radial-gradient(circle,rgba(200,248,255,.95),rgba(160,235,255,0) 70%)}
  .mspot{position:absolute;transform:translate(-50%,-50%);width:60px;height:60px;border-radius:50%;z-index:16;cursor:grab;touch-action:none;
    border:2px dashed rgba(140,220,250,.75);background:rgba(140,220,250,.08);animation:pulse 1.8s infinite}
  .mspot.lock{border:2px solid rgba(140,240,200,.95);background:rgba(140,240,200,.12);animation:none;cursor:default;
    box-shadow:0 0 16px rgba(140,240,200,.55)}
  .beam{position:absolute;left:50%;top:50%;width:4px;height:300px;margin-left:-2px;transform-origin:top center;pointer-events:none;
    background:linear-gradient(180deg,rgba(190,240,255,.9),rgba(190,240,255,0) 85%);opacity:.55;filter:blur(1px);border-radius:3px}
  .mspot.lock .beam{opacity:.95;background:linear-gradient(180deg,rgba(150,255,220,.95),rgba(150,255,220,0) 92%)}
  .sky{position:absolute;top:0;left:0;right:0;height:340px;z-index:12;overflow:hidden;pointer-events:none}
  .rain{position:absolute;top:0;width:2px;height:16px;background:rgba(180,220,240,.7);animation:fall 1s linear infinite}
  @keyframes fall{to{transform:translateY(360px);opacity:0}}

  /* 号码牌键盘 */
  .pad3{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center}
  .pad3 .cbtn{width:64px;padding:10px 0;font-size:15px}
  .pad3 .z{grid-column:2}

  /* 拍卖 */
  .budget{font-size:13px;color:#ffd24a;font-weight:800}
  .lot{background:rgba(16,42,58,.72);border:1px solid rgba(111,195,217,.28);border-radius:var(--r-card);padding:16px;width:100%;text-align:center;color:#eaf4fa}
  .lot .stamp{font-size:34px;margin:6px 0}

  /* 歌词大屏（叠在场景图的电子屏上） */
  .lscreen{position:absolute;left:28%;right:29%;top:37%;height:272px;z-index:15;border-radius:var(--r-card);overflow:hidden;touch-action:none;
    background:rgba(8,40,58,.9);border:1px solid rgba(120,220,250,.55);box-shadow:0 0 26px rgba(80,190,230,.35);transition:box-shadow .4s}
  .lscreen.sync{box-shadow:0 0 40px rgba(127,224,182,.75);border-color:rgba(127,224,182,.9)}
  .lmk{position:absolute;left:6px;right:6px;top:50%;height:34px;transform:translateY(-50%);pointer-events:none;
    border-top:1px solid rgba(127,224,182,.55);border-bottom:1px solid rgba(127,224,182,.55)}
  .lrow{height:34px;display:flex;align-items:center;justify-content:center;font-size:12.5px;color:#7fa8bc;position:relative;white-space:nowrap}
  .lrow.cur{color:#eaf7ff;font-weight:800}
  .wv{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:flex;gap:2px;align-items:flex-end;height:14px}
  .wv i{width:3px;background:#7fe0b6;border-radius:2px;animation:eq .7s ease-in-out infinite alternate}
  .wv i:nth-child(2){animation-delay:.2s}.wv i:nth-child(3){animation-delay:.4s}
  @keyframes eq{from{height:4px}to{height:14px}}

  /* 结局 */
  #ending{background:radial-gradient(circle at 50% 38%,rgba(120,220,240,.4),#0a2536 62%,#061722);justify-content:center;align-items:center;text-align:center;padding:34px}
  #ending h1{font-size:27px;color:#eaf7ff;letter-spacing:4px;margin-bottom:14px;font-family:var(--serif);font-weight:700}
  #ending p{font-size:13px;color:#bfe0ef;line-height:2;margin-bottom:8px}
  #ending .cbtn{margin-top:24px}
</style>
</head>
<body>
<div id="app">
  <div class="hd" id="hd" style="display:none">
    <span class="stp" id="hdStep">场景 1</span>
    <span class="ttl" id="hdTitle">檀香琴斋</span>
    <button class="bgm" id="bgmBtn" onclick="toggleBgm()">🔈</button>
  </div>

  <!-- 剧情开场 -->
  <section class="screen on" id="story">
    <span class="tag">青花瓷 · 时空密室</span>
    <div class="pvase"><i class="lip"></i><i class="neck"></i><i class="body"></i><i class="band"></i><i class="foot"></i></div>
    <h1>坠入瓷中记忆</h1>
    <p>前世，她在古宅抚琴，一纸战书夺走了她；他捧着传世青花瓷赴约，却眼看爱人倒下。染血的执念封进瓷里，流传千年。</p>
    <p>今生轮回，青花瓷再登拍卖台。你触碰它的刹那，坠入瓷中，穿梭古今四段场景，解开执念，<b style="color:#7fe0b6">打破千年悲剧轮回</b>。</p>
    <button class="cbtn" onclick="startLevel()">触碰青花瓷 →</button>
  </section>

  <!-- 关卡舞台 -->
  <section class="screen" id="play">
    <div class="stage" id="stage"></div>
  </section>

  <!-- 结局 -->
  <section class="screen" id="ending">
    <div class="pvase glowing"><i class="lip"></i><i class="neck"></i><i class="body"></i><i class="band"></i><i class="foot"></i></div>
    <h1>轮回已破 · 古今重逢</h1>
    <p>青光贯穿古今，两道身影终于重叠。</p>
    <p>「天青色等烟雨，而我在等你」。这一次，等到了。</p>
    <button class="cbtn" onclick="location.href='index.html?cleared=qhc'">领取「青花瓷 · 中国风」奖励 →</button>
  </section>

  <div class="toast" id="toast"></div>
  <audio id="bgm" src="assets/bgm2.mp3" loop preload="auto"></audio>
</div>

<script>
function fit(){var s=Math.min(innerWidth/393,innerHeight/852);document.getElementById('app').style.transform='scale('+s+')';}
addEventListener('resize',fit);fit();

var bgm=document.getElementById('bgm');
try{bgm.preservesPitch=true;bgm.mozPreservesPitch=true;bgm.webkitPreservesPitch=true;}catch(e){}
function playBgm(){ if(bgm.paused){ bgm.volume=0.55; bgm.play().then(function(){document.getElementById('bgmBtn').textContent='🔊';}).catch(function(){}); } }
function toggleBgm(){ if(bgm.paused){playBgm();} else {bgm.pause();document.getElementById('bgmBtn').textContent='🔈';} }

function show(id){ document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('on');}); document.getElementById(id).classList.add('on'); }
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove('show');},1800); }

/* 线索卡：title/body，ink=夜色卡（石碑/名录等），点击收起 */
function clue(title,body,ink){
  var w=document.createElement('div'); w.className='cluewrap';
  w.innerHTML='<div class="cluecard'+(ink?' ink':'')+'"><h3>'+title+'</h3><div class="bd">'+body+'</div><div class="cls">点击任意处收起</div></div>';
  w.onclick=function(){w.remove();};
  document.getElementById('app').appendChild(w);
  return w;
}

var _bgReady={};
var QHC_V='?v=2';   /* 图片版本号：换图后递增，强制客户端绕过旧缓存（含截断的坏缓存） */
function stageBg(stage,file,extra){
  var url='assets/'+file+QHC_V, tail=extra?','+extra:'';
  if(_bgReady[file]){ stage.style.background="url('"+url+"') center/cover no-repeat"+tail; return; }
  var thumb=QHC_THUMB[file];
  stage.style.background=(thumb?"url('"+thumb+"') center/cover no-repeat"+tail:(extra||''));
  var img=new Image();
  img.onload=function(){ _bgReady[file]=1;
    if(stage.isConnected) stage.style.background="url('"+url+"') center/cover no-repeat"+tail; };
  img.src=url;
}
/* 预加载场景图：场景 1-3 立即拉（玩家读剧情时就绪），其余等页面空闲再拉 */
function warmBg(f){ var i=new Image(); i.onload=function(){_bgReady[f]=1;}; i.src='assets/'+f+QHC_V; }
['qhc_scene1.jpg','qhc_scene2.jpg','qhc_scene3.jpg'].forEach(warmBg);
addEventListener('load',function(){ setTimeout(function(){
  Object.keys(QHC_THUMB).forEach(function(f){ if(!_bgReady[f]) warmBg(f); });
},800); });

];

/* 调试入口：?step=N 直接跳步骤，&b 自动展开操作面板 */
var QS=new URLSearchParams(location.search), AUTOB=QS.has('b');
function startLevel(){ playBgm(); document.getElementById('hd').style.display='flex'; idx=0; show('play'); renderStep(); }
function renderStep(){
  var s=STEPS[idx];
  document.getElementById('hdStep').textContent=s.sc;
  document.getElementById('hdTitle').textContent=s.ti;

}
function solved(msg){

}

/* ---------- S1P1 风门 BPM 同步 ---------- */
function pBpm(stage){
  stage.className='stage'; stageBg(stage,'qhc_scene1.jpg','#7c5a30');
  stage.innerHTML=''+
    '<div class="hint">背景乐忽快忽慢，满屋机关都锁着。先<b>点香炉</b>凑近看看。</div>'+
    '<div class="roomtap" id="rt" style="left:16%;top:60%">香炉</div>';
  document.getElementById('rt').onclick=function(){ bpmCloseup(stage); };
}
function bpmCloseup(stage){
  playBgm();   // 点香炉属于用户手势，确保 bgm 在播（否则整关听不到曲速变化）
  stage.className='stage'; stageBg(stage,'qhc_scene2.jpg','#7c5a30');
  stage.innerHTML=''+
    '<div class="hint">拖动香炉右侧<b>把手</b>调节风门燃速，把曲速调进<b>青色区间</b>稳住 2 秒。</div>'+
    '<div class="gauge"><div class="lab"><span>慢</span><span>原版曲速</span><span>快</span></div>'+
      '<div class="bar"><div class="band"></div><div class="needle" id="ndl" style="left:50%"></div></div>'+
      '<div class="bpm">当前 <span id="bnow">--</span> · 目标 <b>72</b> BPM</div></div>'+
    '<div class="sbar" id="sb"><div class="t"><div class="f" id="sf"></div></div><div class="c" id="sc">同步中…</div></div>'+
    '<div class="glow" id="glw"></div><div class="handle" id="hdl"></div>';
  var RMIN=0.6,RMAX=1.4,TGT=1.0,BAND=0.05,HOLD=2000,TKN=0.34,TKX=0.86;
  var pos=0.5,grab=false,ok=false,hold=0,last=0,wob=0;
  var hdl=document.getElementById('hdl'),ndl=document.getElementById('ndl'),glw=document.getElementById('glw');
  var sb=document.getElementById('sb'),sf=document.getElementById('sf'),sc=document.getElementById('sc'),bnow=document.getElementById('bnow');
  hdl.addEventListener('pointerdown',function(e){e.preventDefault();grab=true;try{hdl.setPointerCapture(e.pointerId);}catch(_){}});
  addEventListener('pointermove',function(e){ if(!grab)return; var r=document.getElementById('app').getBoundingClientRect();
    var xf=(e.clientX-r.left)/r.width; pos=Math.max(0,Math.min(1,(xf-TKN)/(TKX-TKN))); });
  addEventListener('pointerup',function(){grab=false;});
  function loop(t){ if(!document.getElementById('hdl')) return; if(!last)last=t; var dt=t-last;last=t; var rate;
    if(ok)rate=TGT;
    else if(grab){ rate=RMIN+pos*(RMAX-RMIN);
      if(Math.abs(rate-TGT)<=BAND)rate=TGT; }   // 进入青色区间即吸附原速，音乐立刻恢复正常播放
    else{wob+=dt;pos=0.5+0.42*Math.sin(wob/520)+0.12*Math.sin(wob/170);pos=Math.max(0,Math.min(1,pos));rate=RMIN+pos*(RMAX-RMIN);}
    var pr=Math.max(0.5,Math.min(2,rate));
    if(Math.abs((bgm.playbackRate||1)-pr)>0.004){try{bgm.playbackRate=pr;}catch(e){}}  // 只在真变化时赋值，避免每帧写导致音频卡顿
    hdl.style.left=((TKN+pos*(TKX-TKN))*100)+'%';
    ndl.style.left=(((rate-RMIN)/(RMAX-RMIN))*100)+'%';
    bnow.textContent=Math.round(72*rate);
    var inb=Math.abs(rate-TGT)<=BAND; glw.style.opacity=ok?1:Math.max(0,1-Math.abs(rate-TGT)/0.35)*0.9;
    if(!ok){ if(inb&&grab){hold+=dt;sb.classList.add('show');sf.style.width=Math.min(100,hold/HOLD*100)+'%';
        sc.textContent='青光凝聚 '+Math.min(100,Math.round(hold/HOLD*100))+'%'; if(hold>=HOLD){ok=true;glw.style.opacity=1;try{bgm.playbackRate=1;}catch(e){} setTimeout(function(){solved('香炉泛出青光，满屋机关次第解锁');},500);}}
      else{hold=0;sf.style.width='0'; if(!grab)sb.classList.remove('show'); else sc.textContent='把曲速调进青色区间';} }
    requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
}

/* ---------- S1P2 瓷胚水墨调色：先探场景线索，再调水上色 ---------- */
function pPaint(stage){
  stage.className='stage'; stageBg(stage,'qhc_scene3.jpg','#7c5a30');
  var COLORS={deep:'#1f4e79',mid:'#3f83bd',light:'#9fc9e8'};
  var NAMES={deep:'深青',mid:'中青',light:'浅青'};
  var NEED={bot:'deep',mid:'mid',top:'light'};
  var painted={bot:false,mid:false,top:false};
  var water=50, busy=false;
  function cluePaper(){ clue('窗格透光 · 宣纸小字','水减色深，<br>水多加浅。'); }
  function clueDraft(){ clue('桌上残破画稿','重笔勾<b style="color:#1f4e79">底沿轮廓</b><br>中锋铺<b style="color:#3f83bd">缠枝花纹</b><br>轻笔描<b style="color:#7ba8c9">顶上云雾</b>'); }
  function shade(){ return water<34?'deep':(water<67?'mid':'light'); }
  function mixColor(){ // 随水量连续变浅，便于观察
    function hex(c){return parseInt(c,16);}
    function lerp(a,b,t){return Math.round(a+(b-a)*t);}
    function mixHex(c1,c2,t){ var r=lerp(hex(c1.substr(1,2)),hex(c2.substr(1,2)),t),g=lerp(hex(c1.substr(3,2)),hex(c2.substr(3,2)),t),b=lerp(hex(c1.substr(5,2)),hex(c2.substr(5,2)),t);
      return 'rgb('+r+','+g+','+b+')'; }
    return water<50?mixHex(COLORS.deep,COLORS.mid,water/50):mixHex(COLORS.mid,COLORS.light,(water-50)/50);
  }
  function enterPanel(){
    stage.querySelectorAll('.spot,.roomtap').forEach(function(s){s.remove();});
    document.getElementById('phint').innerHTML='兑水调出浓淡，点<b>瓷胚分区</b>上色。线索可随时回看。';
    var p=document.createElement('div'); p.className='panel';
    p.innerHTML=''+
      '<div class="prow"><span class="cluechip" id="c1">◈ 窗上宣纸</span><span class="cluechip" id="c2">◈ 桌上画稿</span></div>'+
      '<div class="vase" id="vs">'+
        '<div class="vzone vz-top" id="z-top"><div class="vfill"><div class="ink"></div></div><span class="zl">上·云雾</span></div>'+
        '<div class="vzone vz-mid" id="z-mid"><div class="vfill"><div class="ink"></div></div><span class="zl">中·缠枝</span></div>'+
        '<div class="vzone vz-bot" id="z-bot"><div class="vfill"><div class="ink"></div></div><span class="zl">下·轮廓</span></div>'+
      '</div>'+
      '<div class="mixrow"><div class="inkwell" id="iw"></div>'+
        '<span style="color:#8fb0c2;font-size:11px">清水少</span>'+
        '<input class="rng" id="wr" type="range" min="0" max="100" value="50">'+
        '<span style="color:#8fb0c2;font-size:11px">清水多</span>'+
        '<span class="shname" id="sn"></span></div>';
    stage.appendChild(p);
    document.getElementById('c1').onclick=cluePaper;
    document.getElementById('c2').onclick=clueDraft;
    var iw=document.getElementById('iw'),sn=document.getElementById('sn');
    function upd(){ iw.style.background=mixColor(); sn.textContent='现调：'+NAMES[shade()]; }
    document.getElementById('wr').oninput=function(){ water=+this.value; upd(); }; upd();
    ['top','mid','bot'].forEach(function(z){
      var zone=document.getElementById('z-'+z);
      zone.onclick=function(){
        if(busy||painted[z])return; busy=true;
        var s=shade(), ink=zone.querySelector('.ink');
        ink.style.background=COLORS[s]; zone.classList.add('on');
        setTimeout(function(){
          if(s===NEED[z]){ painted[z]=true; zone.style.background=COLORS[s]; busy=false;
            if(painted.bot&&painted.mid&&painted.top){ document.getElementById('vs').classList.add('done'); setTimeout(function(){solved('青花晕染，纹样与画稿相合');},600); }
          } else { zone.classList.add('bad'); toast('浓淡不合画稿，这层洗去了');
            setTimeout(function(){ zone.classList.remove('on','bad'); ink.style.background=''; busy=false; },600); }
        },1000);
      };
    });
  }
  stage.innerHTML=''+
    '<div class="hint" id="phint">桌上的<b>空白瓷胚</b>等着上色。窗上、桌上似乎各藏着一条线索。</div>'+
    '<div class="spot" style="left:45%;top:19%">宣纸</div>'+
    '<div class="spot" style="left:85%;top:60%">画稿</div>'+
    '<div class="roomtap" style="left:40%;top:52%">瓷胚</div>';
  stage.querySelectorAll('.spot')[0].onclick=cluePaper;
  stage.querySelectorAll('.spot')[1].onclick=clueDraft;
  stage.querySelector('.roomtap').onclick=enterPanel;
  if(AUTOB)enterPanel();
}

/* ---------- S2P1 铜镜聚云：场景内四镜拖调角度，镜光汇于云心 ---------- */
function pMirror(stage){
  stage.className='stage'; stageBg(stage,'qhc_scene6.jpg','linear-gradient(180deg,#26384a,#12202c)');
  var TP={x:0.48,y:0.16};                                   // 云心（天空目标点）
  var MS=[{x:0.45,y:0.43},{x:0.80,y:0.44},{x:0.08,y:0.70},{x:0.93,y:0.70}];  // 四面铜镜在图中的位置
  var ang=[30,-170,120,-20], locked=[false,false,false,false], act=-1;
  stage.innerHTML=''+
    '<div class="hint">夜色沉沉，云散不聚。<b>按住铜镜拖动</b>，让四道镜光汇聚到<b>云心</b>。</div>'+
    '<div class="skyaim" id="aim" style="left:'+(TP.x*100)+'%;top:'+(TP.y*100)+'%"></div>';
  var spots=[],beams=[];
  function tgtDeg(i){ return Math.atan2((TP.y-MS[i].y)*852,(TP.x-MS[i].x)*393)*180/Math.PI; }
  function dist(i){ var dx=(TP.x-MS[i].x)*393, dy=(TP.y-MS[i].y)*852; return Math.sqrt(dx*dx+dy*dy); }
  function dDiff(a,b){ return Math.abs(((a-b+540)%360)-180); }
  function setBeam(i,deg){ beams[i].style.transform='rotate('+(deg-90)+'deg)'; }
  MS.forEach(function(m,i){
    var sp=document.createElement('div'); sp.className='mspot'; sp.style.left=(m.x*100)+'%'; sp.style.top=(m.y*100)+'%';
    var bm=document.createElement('div'); bm.className='beam'; sp.appendChild(bm);
    spots.push(sp); beams.push(bm); stage.appendChild(sp);
    setBeam(i,ang[i]);
    sp.addEventListener('pointerdown',function(e){ if(locked[i])return; e.preventDefault(); act=i; try{sp.setPointerCapture(e.pointerId);}catch(_){}} );
    sp.addEventListener('pointermove',function(e){ if(act!==i)return;
      var r=document.getElementById('app').getBoundingClientRect();
      var cx=r.left+m.x*r.width, cy=r.top+m.y*r.height;
      var deg=Math.atan2(e.clientY-cy,e.clientX-cx)*180/Math.PI;
      ang[i]=deg; setBeam(i,deg);
      if(dDiff(deg,tgtDeg(i))<=8){ locked[i]=true; act=-1; ang[i]=tgtDeg(i); setBeam(i,ang[i]);
        beams[i].style.height=(dist(i)+30)+'px'; sp.classList.add('lock'); toast('这面镜子照准了云心');
        if(locked.every(function(v){return v;})) win(); } });
    sp.addEventListener('pointerup',function(){ if(act===i)act=-1; });
  });
  function win(){
    document.getElementById('aim').classList.add('hit');
    setTimeout(function(){
      stageBg(stage,'qhc_scene7.jpg','linear-gradient(180deg,#26384a,#12202c)');
      var sky=document.createElement('div'); sky.className='sky'; stage.appendChild(sky);
      for(var i=0;i<26;i++){var d=document.createElement('div');d.className='rain';d.style.left=(Math.random()*100)+'%';d.style.animationDelay=(Math.random())+'s';sky.appendChild(d);}
      setTimeout(function(){solved('云聚了，雨也落了');},1200);
    },700);
  }
}

  var NUM='0716';
  var cards=[
    {x:8, e:'🪷',n:'缠枝莲纹'},
    {x:33,e:'🌿',n:'卷草纹'},
    {x:59,e:'🌊',n:'海水纹'},
    {x:83,e:'🐟',n:'锦鲤纹',koi:true}
  ];
  function clueList(){ clue('拍卖名录 · 压轴','青花瓷一尊。<br>「色白花青的<b style="color:#d9822b">锦鲤</b>跃然于碗底」','ink'); }
  function viewCard(c){
    var w=document.createElement('div'); w.className='cluewrap';
    if(c.koi){

        '<div class="bd">牌面号码<br><b style="font-size:26px;letter-spacing:6px;color:#8a5a20">'+NUM+'</b></div>'+
        '<button class="cbtn" id="take">收下此牌</button></div>';
      w.querySelector('#take').onclick=function(e){ e.stopPropagation(); w.remove(); toast('记住号码，去门前输入'); enterDoor(); };
      w.onclick=function(e){ if(e.target===w)w.remove(); };
    } else {
      w.innerHTML='<div class="cluecard"><h3>竞拍牌 · '+c.n+'</h3><div class="big">'+c.e+'</div>'+
        '<div class="bd">似乎不是名录里说的那块。</div><div class="cls">点击任意处放回</div></div>';

  function enterDoor(){

    var code='';
    var p=document.createElement('div'); p.className='panel';
    p.innerHTML=''+
      '<div style="color:#bfe0ef;font-size:22px;letter-spacing:10px;background:rgba(0,0,0,.35);border-radius:10px;padding:8px 26px" id="kd">····</div>'+
      '<div class="pad3" id="pad"></div>'+
      '<span class="cluechip" id="peek">◈ 再看一眼号码牌</span>';
    stage.appendChild(p);
    document.getElementById('peek').onclick=function(){ viewCard(cards[3]); };
    var pad=document.getElementById('pad');
    '1234567890'.split('').forEach(function(d){
      var b=document.createElement('button'); b.className='cbtn ghost'+(d==='0'?' z':''); b.textContent=d;
      b.onclick=function(){ if(code.length>=4)return; code+=d;
        document.getElementById('kd').textContent=code.padEnd(4,'·');
        if(code.length===4){ if(code===NUM){ setTimeout(function(){solved('验号通过，入厅');},300); }
          else { toast('号码不对'); code=''; setTimeout(function(){document.getElementById('kd').textContent='····';},400); } } };
      pad.appendChild(b); });
  }
  stage.innerHTML=''+
    '<div class="hint" id="thint">签到处摆着<b>四块青花牌</b>，只有一块能带你进门。桌上的<b>名录</b>或有指引。</div>'+
    cards.map(function(c,i){return '<div class="spot" data-i="'+i+'" style="left:'+c.x+'%;top:70%;width:70px;height:88px;border-radius:12px">青花牌</div>';}).join('')+
    '<div class="spot" data-i="list" style="left:49%;top:84%">名录</div>';
  stage.querySelectorAll('.spot').forEach(function(sp){

    sp.onclick = k==='list' ? clueList : function(){ viewCard(cards[+k]); };
  });

}

/* ---------- S3P2 举牌竞价：拍卖师开场点出汉隶与起拍价 ---------- */
function pAuction(stage){
  stage.className='stage'; stageBg(stage,'qhc_scene10.jpg','linear-gradient(180deg,#2a2038,#140f22)');
  var lots=[{s:'楷书底款',ok:false,npc:42},{s:'篆书底款',ok:false,npc:38},{s:'行书底款',ok:false,npc:35},{s:'汉隶底款',ok:true,npc:0}];
  var budget=100, round=0;
  stage.innerHTML=''+
    '<div class="hint">预算 <b>100 万美元</b>。听清拍卖师的话，拍下<b>压轴</b>的那件青花瓷。</div>'+
    '<div class="panel"><div class="budget" id="bud">预算：100 万</div><div class="lot" id="lot"></div>'+
    '<div class="prow" id="abtn" style="margin-top:6px"></div></div>';
  var op=document.createElement('div'); op.className='cluewrap';
  op.innerHTML='<div class="cluecard ink"><h3>拍卖师开场</h3><div class="bd">「诸位来宾，今日四件瓷器依次开拍。<br>本场唯一以<b style="color:#ffd24a">汉隶为底款</b>者，即压轴拍品，<br>起拍 <b style="color:#ffd24a">15 万美元</b>。」</div><div class="cls">点击落槌开拍</div></div>';
  op.onclick=function(){op.remove();};
  document.getElementById('app').appendChild(op);
  function draw(){ var lot=lots[round];
    document.getElementById('lot').innerHTML='<div>第 '+(round+1)+' 件</div><div class="stamp">🏺</div><div style="font-size:16px;font-weight:800">'+lot.s+'</div>'+(lot.ok?'<div style="color:#ffd24a;font-size:12px;margin-top:4px">压轴 · 起拍 15 万</div>':'<div style="color:#8fb0c2;font-size:12px;margin-top:4px">NPC 最高 '+lot.npc+' 万</div>');
    var b=document.getElementById('abtn'); b.innerHTML='';
    if(!lot.ok){ mk(b,'举牌竞价（'+(lot.npc+3)+'万）',function(){ if(budget<lot.npc+3){toast('预算不足');return;} budget-=(lot.npc+3); upd(); toast('拍下'+lot.s); next(); });
      mk(b,'放弃竞价',function(){ toast('放弃，留住预算'); next(); },true); }
    else { var price=15;
      var giveUp=function(){ toast('放弃竞价，成全了她'); setTimeout(function(){solved('她拍下青花瓷，你们相约博物馆');},400); };
      var raise=function(){
        document.getElementById('lot').innerHTML+='<div style="color:#e8d9b8;margin-top:8px">你举牌 '+price+' 万</div><div style="color:#7fe0b6;margin-top:4px">女主举牌 '+(price+5)+' 万……</div>';
        price+=10; b.innerHTML='';
        if(budget>=price){ mk(b,'继续举牌（'+price+' 万）',raise); mk(b,'放弃继续加价（成全她）',giveUp,true); }
        else { document.getElementById('lot').innerHTML+='<div style="color:#ff8a8a;margin-top:4px">预算不足 '+price+' 万，无力再加价…</div>'; mk(b,'放弃竞价（让给她）',giveUp); }
      };
      if(budget<15){ document.getElementById('lot').innerHTML+='<div style="color:#ff8a8a;margin-top:8px">预算不足 15 万，无力举牌…</div>'; mk(b,'放弃竞价，让给女主',giveUp); }
      else mk(b,'举牌 15 万',raise); }
  }
  function mk(box,txt,fn,ghost){ var el=document.createElement('button'); el.className='cbtn'+(ghost?' ghost':''); el.style.fontSize='13px'; el.style.padding='11px 14px'; el.textContent=txt; el.onclick=fn; box.appendChild(el); }
  function upd(){ document.getElementById('bud').textContent='预算：'+budget+' 万'; }
  function next(){ round++; if(round<lots.length) draw(); }
  draw();
}

/* ---------- S4P1 歌词同步：歌词经 /api/lyric（fcg_music_custom_get_lyric.fcg）实时取回，
   在场景大屏上直接拨动歌词，对齐真实播放行；接口失败时回退内置歌词 ---------- */
function pLyric(stage){
  stage.className='stage'; stageBg(stage,'qhc_scene11.jpg','linear-gradient(180deg,#12303a,#08202a)');
  var FALLBACK=['素胚勾勒出青花','笔锋浓转淡','瓶身描绘的牡丹','一如你初妆','冉冉檀香透过窗','心事我了然','宣纸上走笔至此搁一半','釉色渲染仕女图','韵味被私藏','天青色等烟雨','而我在等你'];
  stage.innerHTML=''+
    '<div class="hint">大屏正在<b>连接曲库</b>，取回《青花瓷》歌词…</div>'+
    '<div class="lscreen" id="lsc"><div class="lrow cur" id="lload" style="position:absolute;left:0;right:0;top:50%;transform:translateY(-50%)">♪ 歌词加载中…</div><div class="lmk"></div></div>';
  var loadNode=document.getElementById('lload');
  function toTimed(lines){ return lines.map(function(s,i){return {t:i*4.0,s:s};}); } // 无时间戳时按每句4秒铺轴
  fetch('/api/lyric?name='+encodeURIComponent('青花瓷'))
    .then(function(r){return r.json();})
    .then(function(d){
      if(d&&d.timed&&d.timed.length>=6) build(d.timed.slice(0,40), d.source);
      else if(d&&d.lines&&d.lines.length>=6) build(toTimed(d.lines.slice(0,12)), d.source);
      else build(toTimed(FALLBACK),'mock');
    })
    .catch(function(){ build(toTimed(FALLBACK),'mock'); });

  function build(T,src){
  if(!loadNode.isConnected)return;       // 场景已切走，放弃渲染
  var L=T.map(function(x){return x.s;});
  var ROW=34, MID=119;                   // 行高34；屏高272的中线偏移
  // 故障错位随机 ±2~3 句（不写死），过关条件 = 中线那句与音乐实际唱到的位置一致
  var offset=(Math.random()<0.5?-1:1)*(2+(Math.random()<0.5?0:1));
  var drag=null, alignT=0, done=false, lastT=0;
  playBgm();                             // 真同步需要音乐在播
  stage.innerHTML=''+
    '<div class="hint">大屏故障，歌词与音乐<b>不同步</b>。听歌声、上下<b>拨动歌词</b>，让正在唱的 ♪ 那句停进中间刻度。'+(src==='qqmusic'?'<br><span style="color:#7fe0b6">✓ 歌词与时间轴实时来自 QQ 音乐曲库</span>':'')+'</div>'+
    '<div class="lscreen" id="lsc"><div id="ll" style="position:absolute;left:0;right:0;top:0"></div><div class="lmk"></div></div>'+
    '<div id="lst" style="position:absolute;left:0;right:0;top:70%;text-align:center;font-size:12px;color:#bfe0ef;z-index:15;text-shadow:0 1px 3px #000"></div>';
  var ll=document.getElementById('ll'), lsc=document.getElementById('lsc'), lst=document.getElementById('lst');
  L.forEach(function(t,i){ var d=document.createElement('div'); d.className='lrow'; d.id='lr'+i; d.textContent=t; ll.appendChild(d); });
  var wv=document.createElement('div'); wv.className='wv'; wv.innerHTML='<i></i><i></i><i></i>';
  function scale(){ return document.getElementById('app').getBoundingClientRect().height/852; }
  lsc.addEventListener('pointerdown',function(e){ if(done)return; e.preventDefault(); drag={y0:e.clientY,dy:0}; try{lsc.setPointerCapture(e.pointerId);}catch(_){}});
  lsc.addEventListener('pointermove',function(e){ if(!drag)return; drag.dy=(e.clientY-drag.y0)/scale(); });
  function drop(){ if(!drag)return; offset=Math.max(-5,Math.min(5,Math.round(offset-drag.dy/ROW))); drag=null; }
  lsc.addEventListener('pointerup',drop); lsc.addEventListener('pointercancel',drop);
  function trueIdx(){ // 音乐实际唱到哪句：LRC 时间轴上最后一个 t<=currentTime 的行
    var t=bgm.currentTime||0, i=0;
    for(var k=0;k<T.length;k++){ if(T[k].t<=t) i=k; else break; }
    return i;
  }
  function loop(ts){
    if(!document.getElementById('lsc'))return;
    if(!lastT)lastT=ts; var dt=ts-lastT; lastT=ts;
    var ti=trueIdx();
    var dragRows=drag?drag.dy/ROW:0;
    var y=MID-(ti+offset)*ROW+(drag?drag.dy:0);
    ll.style.transform='translateY('+y+'px)';
    var cur=ti+offset-Math.round(dragRows);
    L.forEach(function(_,i){ document.getElementById('lr'+i).classList.toggle('cur',i===cur); });
    var tr=document.getElementById('lr'+ti); if(wv.parentNode!==tr)tr.appendChild(wv);
    if(!done){
      if(offset===0&&!drag){ alignT+=dt; lst.textContent='对上了，稳住… '+Math.min(100,Math.round(alignT/1200*100))+'%';
        if(alignT>=1200){ done=true; lsc.classList.add('sync'); lst.textContent=''; setTimeout(function(){solved('记忆同步完成');},500); } }
      else { alignT=0; lst.textContent = offset===0?'松手稳住…':('错位 '+Math.abs(offset)+' 句'); }
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  }
}
